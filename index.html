*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-display:swap}
:root{
  --bg:#08090b; --bg2:#0d1013; --panel:#12161a; --panel2:#161b20;
  --line:rgba(150,255,150,.10); --line-bright:rgba(80,220,80,.35);
  --silver:#cfd6db; --silver-bright:#f2f4f6; --ash:#9aa5ab; --mist:#b0b8be;
  --green:#3ee23e; --green-bright:#7bff5c; --green-dim:#1d7a28;
  --body:#c6cdd2;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--body);font-family:'Inter', 'Inter Fallback', sans-serif;font-weight:300;font-size:15px;overflow-x:hidden;line-height:1.6}
h1,h2,h3,.brand-font{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;letter-spacing:.03em}
a{color:inherit}
img{max-width:100%;display:block}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:.9rem 3rem;background:linear-gradient(to bottom,rgba(8,9,11,.96) 0%,transparent 100%);transition:background .3s}
nav.scrolled{background:rgba(8,9,11,.97);border-bottom:1px solid var(--line)}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.nav-logo img{height:38px;width:auto}

.nav-links a{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:600;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--mist);text-decoration:none;transition:color .25s}
.nav-links a:hover,.nav-links a.active{color:var(--green-bright)}
.hamburger{display:none;background:0 0;border:none;color:var(--green);font-size:1.8rem;cursor:pointer;padding:.3rem}

.top-banner{padding:8.5rem 3rem 2.5rem;text-align:center;background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(62,226,62,.08) 0%, transparent 60%),linear-gradient(180deg,#0a0c0e 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.top-banner img.hero-mark{height:420px;margin:0 auto 1rem;filter:drop-shadow(0 0 24px rgba(62,226,62,.25));width:auto}
.top-eyebrow{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:600;font-size:.9rem;letter-spacing:.4em;text-transform:uppercase;color:var(--green);margin-bottom:.4rem}
.top-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:700;color:var(--silver-bright);letter-spacing:.06em}
.top-sub{margin-top:.5rem;font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:500;font-size:.95rem;letter-spacing:.25em;text-transform:uppercase;color:var(--ash)}
.top-banner.small{padding:7rem 3rem 2.2rem}

.doors{max-width:1180px;margin:0 auto;padding:3.5rem 2rem 5rem;display:flex;flex-direction:column;gap:1.5rem}
.door{position:relative;border:1px solid var(--line);background:var(--panel);padding:2.8rem;overflow:hidden;transition:border-color .3s,transform .3s}
.door::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--green) 0%,var(--green-dim) 100%);transform:scaleY(0);transform-origin:top;transition:transform .4s}
.door:hover{border-color:var(--line-bright);transform:translateY(-2px)}
.door:hover::before{transform:scaleY(1)}
.door-eyebrow{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.35em;text-transform:uppercase;color:var(--green);margin-bottom:.7rem}
.door-title{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:.05em;color:var(--silver-bright);margin-bottom:1rem}
.door-title sup{font-size:.5em;color:var(--green)}

.door-body a{color:var(--green-bright);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.door-body a:hover{color:var(--silver-bright)}

.door-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}

.btn-hero{min-width:300px;justify-content:center}
.btn:hover{background:var(--green);color:#04140a;border-color:var(--green)}
.btn.primary{background:var(--green);color:#04140a;border-color:var(--green)}

.door-lh{display:flex;align-items:center;gap:2.5rem;flex-wrap:wrap}

.value-card{border:1px solid var(--line);background:var(--panel2);padding:1.5rem}

.p2p-socials a:hover{background:var(--green);border-color:var(--green);color:#04140a;transform:translateY(-2px)}
.p2p-socials svg{width:20px;height:20px}
.p2p-socials span{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;line-height:1.2}
.p2p-handle{margin-top:1rem;font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:600;letter-spacing:.15em;color:var(--green-bright);font-size:.9rem}

footer{background:var(--bg);padding:2.5rem 3rem;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.footer-brand{font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif;font-weight:700;letter-spacing:.1em;color:var(--silver-bright);font-size:1rem}
.footer-tagline{font-size:.72rem;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif}
.footer-brands{font-size:.72rem;letter-spacing:.1em;color:var(--green-bright);font-family:'Rajdhani', 'Rajdhani Fallback', sans-serif}
.footer-links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;font-size:.72rem}
.footer-links a{color:var(--ash);text-decoration:none;transition:color .25s}
.footer-links a:hover{color:var(--green-bright)}
.footer-copy{font-size:.7rem;color:var(--ash);margin-top:.4rem;text-align:left}
.footer-copy a{color:var(--green-bright);text-decoration:underline}
.footer-copy a:hover{color:var(--green-bright)}

@media(max-width:900px){
  .door-row{grid-template-columns:1fr}
  .door-row.thirds{grid-template-columns:1fr}
  .value-grid{grid-template-columns:1fr}
  .p2p-socials{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){

  .nav-links.open{display:flex}
  .top-banner{padding:7rem 1.25rem 2rem}
  .top-banner img.hero-mark{height:260px}
  .doors{padding:2.5rem 1.25rem 3.5rem}
  .door{padding:1.8rem}
  .door-lh{flex-direction:column;text-align:center}
  .p2p-socials{grid-template-columns:repeat(2,1fr)}

  .door-body.p2p-lines br{display:none}
  .door-row{gap:1rem}
  .value-card{padding:1.2rem}
  .btn-hero{min-width:0;width:100%;padding:.75rem 1rem;font-size:.78rem;letter-spacing:.08em;gap:.4rem}
}
