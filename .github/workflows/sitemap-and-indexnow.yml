name: Sitemap + IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'harvest/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sitemap.xml
        run: |
          TODAY=$(date +%Y-%m-%d)
          DATES=$(ls -d harvest/*/ 2>/dev/null | sed 's|harvest/||;s|/||' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort)

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "<url><loc>https://www.locustharvest.com/</loc><lastmod>${TODAY}</lastmod><changefreq>daily</changefreq><priority>1.0</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/harvest/</loc><lastmod>${TODAY}</lastmod><changefreq>daily</changefreq><priority>0.9</priority></url>"
            for DATE in $DATES; do
              echo "<url><loc>https://www.locustharvest.com/harvest/${DATE}/</loc><lastmod>${DATE}</lastmod><changefreq>monthly</changefreq><priority>0.7</priority></url>"
            done
            echo "<url><loc>https://www.locustharvest.com/about.html</loc><lastmod>${TODAY}</lastmod><changefreq>monthly</changefreq><priority>0.6</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/contact.html</loc><lastmod>${TODAY}</lastmod><changefreq>monthly</changefreq><priority>0.5</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/terms.html</loc><lastmod>${TODAY}</lastmod><changefreq>yearly</changefreq><priority>0.3</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/privacy.html</loc><lastmod>${TODAY}</lastmod><changefreq>yearly</changefreq><priority>0.3</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/cookies.html</loc><lastmod>${TODAY}</lastmod><changefreq>yearly</changefreq><priority>0.3</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/novelty-legal.html</loc><lastmod>${TODAY}</lastmod><changefreq>yearly</changefreq><priority>0.3</priority></url>"
            echo "<url><loc>https://www.locustharvest.com/thank-you.html</loc><lastmod>${TODAY}</lastmod><changefreq>yearly</changefreq><priority>0.2</priority></url>"
            echo '</urlset>'
          } > sitemap.xml

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-update sitemap.xml [skip ci]"
          git push

      - name: Ping IndexNow
        run: |
          curl -sS -f "https://api.indexnow.org/indexnow?url=https://www.locustharvest.com/sitemap.xml&key=${{ secrets.INDEXNOW_KEY }}"
